<!DOCTYPE html>
<html>
<head>
    <title>Exam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <script>
        let timeLeft = 120;

        function startTimer() {
            let timer = document.getElementById("timer");

            let countdown = setInterval(function () {

                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;

                timer.innerHTML = minutes + ":" + (seconds < 10 ? "0" : "") + seconds;

                timeLeft--;

                if (timeLeft < 0) {
                    clearInterval(countdown);
                    document.getElementById("examForm").submit();
                }

            }, 1000);
        }

        window.onload = startTimer;
    </script>

</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">Exam</span>
    <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
</nav>

<div class="container mt-4">

<h4>Time Left: <span id="timer" class="badge bg-danger">Loading...</span></h4>

<form id="examForm" method="POST" action="/submit">

{% for q in questions %}
    <div class="card p-3 mt-3 shadow-sm">
        <p><b>Q{{ loop.index }}: {{ q.question }}</b></p>

        {% for option in q.options %}
            <div class="form-check">
                <input class="form-check-input" type="radio" name="q{{ q.id }}" value="{{ option }}">
                <label class="form-check-label">{{ option }}</label>
            </div>
        {% endfor %}
    </div>
{% endfor %}

<br>

<button class="btn btn-primary">Submit Exam</button>

</form>

</div>

</body>
</html>
