<!DOCTYPE html>
<html>
<head>
    <title>Exam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">

    <script>
        let timeLeft = 60; // change to 10800 for 3 hours

        function startTimer() {
            let timer = document.getElementById("timer");

            let countdown = setInterval(function () {

                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;

                timer.innerHTML = minutes + ":" + (seconds < 10 ? "0" : "") + seconds;

                timeLeft--;

                if (timeLeft === 30) {
                    document.getElementById("message").innerHTML = "⚠️ Only 30 seconds left!";
                }

                if (timeLeft < 0) {
                    clearInterval(countdown);

                    document.getElementById("message").innerHTML = "Time's up! Submitting...";

                    setTimeout(function () {
                        document.getElementById("examForm").submit();
                    }, 1000);
                }

            }, 1000);
        }

        window.onload = startTimer;
    </script>

</head>
<body>

<!-- 🔥 NAVBAR -->
<div class="navbar">
    <h2>Exam System</h2>

    <div>
        <a href="/dashboard">Home</a>
        <a href="/history">History</a>
        <a href="/logout">Logout</a>
    </div>
</div>

<!-- 🔥 MAIN CONTENT -->
<div class="container">

<h2>Exam</h2>

<h3>Time Left: <span id="timer">Loading...</span></h3>
<p id="message" style="color:red;"></p>

<form id="examForm" method="POST" action="/submit">

{% for q in questions %}
    <div class="question">
        <p><b>Q{{ loop.index }}: {{ q.question }}</b></p>

        {% for option in q.options %}
            <input type="radio" name="q{{ q.id }}" value="{{ option }}"> {{ option }}<br>
        {% endfor %}
    </div>
{% endfor %}

<br>

<button type="submit">Submit Exam</button>

</form>

</div>

</body>
</html>
