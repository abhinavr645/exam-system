<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- 🔥 Navbar -->
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">Exam System</span>

    <div>
        <a href="/history" class="btn btn-outline-light btn-sm">History</a>

        {% if session['user'] == 'admin' %}
        <a href="/admin" class="btn btn-warning btn-sm">Admin</a>
        {% endif %}

        <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
    </div>
</nav>

<!-- 🔥 Main -->
<div class="container mt-5">

    <div class="card shadow p-4">
        <h3>Welcome, {{ session['user'] }}</h3>
        <hr>

        <h5>Select Exam</h5>

        <div class="mt-3">
            <a href="/test/1" class="btn btn-primary">Java Test</a>
            <a href="/test/2" class="btn btn-success">Aptitude Test</a>
        </div>
    </div>

</div>

</body>
</html>
