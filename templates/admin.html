<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">Admin Panel</span>
    <div>
        <a href="/dashboard" class="btn btn-outline-light btn-sm">Dashboard</a>
        <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
    </div>
</nav>

<div class="container mt-5">

<div class="card p-4 shadow">

<h3>Add Question</h3>
<hr>

<form method="POST" action="/add_question">

    <input type="number" name="exam_id" class="form-control mb-2" placeholder="Exam ID" required>
    <input type="text" name="question" class="form-control mb-2" placeholder="Question" required>
    <input type="text" name="option1" class="form-control mb-2" placeholder="Option 1" required>
    <input type="text" name="option2" class="form-control mb-2" placeholder="Option 2" required>
    <input type="text" name="option3" class="form-control mb-2" placeholder="Option 3" required>
    <input type="text" name="option4" class="form-control mb-2" placeholder="Option 4" required>
    <input type="text" name="correct" class="form-control mb-3" placeholder="Correct Answer" required>

    <button class="btn btn-success w-100">Add Question</button>

</form>

<hr>

<h4>AI Question Generator</h4>

<form method="POST" action="/generate">

    <input type="text" name="topic" class="form-control mb-3" placeholder="Enter topic (e.g. Java OOP)" required>

    <button class="btn btn-warning w-100">Generate Questions</button>

</form>

</div>

</div>

</body>
</html>
