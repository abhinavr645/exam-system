<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- 🔥 SIDEBAR -->
<div class="sidebar">
    <h3>Admin Panel</h3>

    <a href="/dashboard">🏠 Dashboard</a>
    <a href="/history">📊 History</a>
    <a href="/logout">🚪 Logout</a>
</div>

<!-- 🔥 MAIN CONTENT -->
<div class="main">

<div class="card">

<h2>⚙️ Admin Panel</h2>

<!-- ================= ADD QUESTION ================= -->
<h3>Add Question</h3>

<form method="POST" action="/add_question">
    <input type="number" name="exam_id" placeholder="Exam ID" required><br><br>

    <input type="text" name="question" placeholder="Question" required><br><br>

    <input type="text" name="option1" placeholder="Option 1" required><br><br>
    <input type="text" name="option2" placeholder="Option 2" required><br><br>
    <input type="text" name="option3" placeholder="Option 3" required><br><br>
    <input type="text" name="option4" placeholder="Option 4" required><br><br>

    <input type="text" name="correct" placeholder="Correct Answer" required><br><br>

    <button class="btn btn-success">Add Question</button>
</form>

<hr>

<!-- ================= AI GENERATOR ================= -->
<h3>🤖 AI Question Generator</h3>

<form method="POST" action="/generate">
    <input type="text" name="topic" placeholder="Enter topic (e.g. Java OOP)" required><br><br>

    <button class="btn btn-primary">Generate Questions</button>
</form>

<hr>

<!-- ================= MANAGE QUESTIONS ================= -->
<h3>📋 Manage Questions</h3>

<table border="1" width="100%" cellpadding="10">
<tr>
    <th>ID</th>
    <th>Question</th>
    <th>Action</th>
</tr>

{% for q in questions %}
<tr>
    <td>{{ q[0] }}</td>
    <td>{{ q[2] }}</td>
    <td>

        <!-- DELETE BUTTON -->
        <form method="POST" action="/delete_question" style="display:inline;">
            <input type="hidden" name="id" value="{{ q[0] }}">
            <button class="btn btn-danger"
                onclick="return confirm('Are you sure you want to delete this question?')">
                Delete
            </button>
        </form>

    </td>
</tr>
{% endfor %}

</table>

</div>

</div>

</body>
</html>
